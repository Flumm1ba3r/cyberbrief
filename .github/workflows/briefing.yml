name: Briefing

on:
  schedule:
    - cron: '17 * * * *' # every hour
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['site/**', 'scripts/**', 'sources.json', 'package.json', 'package-lock.json', '.github/workflows/briefing.yml']

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Build briefing
        run: node scripts/build-briefing.mjs
        env:
          # Optional. Without it, summaries are the outlets' own feed excerpts.
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          # Optional repository variable to choose the summarizing model.
          CLAUDE_MODEL: ${{ vars.CLAUDE_MODEL }}
          # The live briefing, so summaries from earlier runs are reused instead of paid for again.
          PREVIOUS_URL: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/data/briefing.json
          # Story archive, cached CVE details and earlier decisions, for follow-ups and to avoid repeat work.
          STATE_URL: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/data/state.json
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
