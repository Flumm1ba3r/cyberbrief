name: Feed check

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['feedcheck/**', '.github/workflows/feedcheck.yml']

permissions:
  contents: read

concurrency:
  group: feedcheck
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write # only to overwrite the feedcheck-results branch
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - run: node feedcheck/feedcheck.mjs
      - name: Publish results to the feedcheck-results branch (overwritten each run)
        run: |
          cd feedcheck-results
          git init -q -b feedcheck-results
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "Feed check results ${GITHUB_RUN_ID}"
          git push -f "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" feedcheck-results
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
