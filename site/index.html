<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; img-src 'self' data:; style-src 'self'; script-src 'self'; connect-src 'self'; manifest-src 'self'; worker-src 'self'; base-uri 'none'; form-action 'none'">
  <meta name="referrer" content="no-referrer">
  <title>CyberBrief</title>
  <meta name="description" content="Your cybersecurity news briefing: the most important stories from trusted sources, summarized.">
  <meta name="theme-color" content="#0d1117" media="(prefers-color-scheme: dark)">
  <meta name="theme-color" content="#f6f7f9" media="(prefers-color-scheme: light)">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="CyberBrief">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <link rel="stylesheet" href="styles.css?v=6">
  <script type="module" src="app.js?v=7"></script>
</head>
<body>
  <header class="top">
    <div class="bar">
      <div class="brand">
        <img src="icons/icon.svg" alt="" width="28" height="28">
        <div>
          <h1>CyberBrief</h1>
          <p id="updated" class="muted">Loading…</p>
        </div>
      </div>
      <div class="bar-actions">
      <button id="settings" class="icon-btn" type="button" aria-label="Settings" aria-haspopup="dialog">
        <svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true"><path fill="currentColor" d="M10.3 2h3.4l.5 2.6c.6.2 1.2.5 1.7.9l2.5-.9 1.7 2.9-2 1.8a7 7 0 0 1 0 1.9l2 1.8-1.7 2.9-2.5-.9c-.5.4-1.1.7-1.7.9l-.5 2.6h-3.4l-.5-2.6c-.6-.2-1.2-.5-1.7-.9l-2.5.9-1.7-2.9 2-1.8a7 7 0 0 1 0-1.9l-2-1.8 1.7-2.9 2.5.9c.5-.4 1.1-.7 1.7-.9L10.3 2ZM12 8.5a3.5 3.5 0 1 0 0 7 3.5 3.5 0 0 0 0-7Z"/></svg>
      </button>
      <button id="refresh" class="icon-btn" type="button" aria-label="Refresh">
        <svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true"><path fill="currentColor" d="M12 4a8 8 0 0 1 7.75 6h-2.1A6 6 0 1 0 18 14h2.03A8 8 0 1 1 12 4Zm5 1h3v5h-5V8h1.6A6 6 0 0 0 12 6V4a8 8 0 0 1 5 1.76V5Z"/></svg>
      </button>
      </div>
    </div>
    <nav class="tabs" role="tablist" aria-label="View">
      <button role="tab" data-view="top" aria-selected="true">Top</button>
      <button role="tab" data-view="latest" aria-selected="false">Latest</button>
      <button role="tab" data-view="week" aria-selected="false">Week</button>
      <button role="tab" data-view="saved" aria-selected="false">Saved</button>
    </nav>
    <div class="filters">
      <div id="chips" class="chips" role="group" aria-label="Category"></div>
      <label class="search">
        <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><path fill="currentColor" d="M10 3a7 7 0 0 1 5.6 11.2l5.1 5.1-1.4 1.4-5.1-5.1A7 7 0 1 1 10 3Zm0 2a5 5 0 1 0 0 10 5 5 0 0 0 0-10Z"/></svg>
        <input id="q" type="search" placeholder="Search stories, CVEs, vendors" autocomplete="off" enterkeyhint="search">
      </label>
    </div>
  </header>

  <div id="banner" class="banner" hidden></div>

  <main id="list" aria-live="polite"></main>

  <footer id="foot" class="foot"></footer>

  <dialog id="settings-dlg" aria-labelledby="settings-title">
    <form method="dialog">
      <h2 id="settings-title">Settings</h2>
      <label class="field">
        <span>Watchlist</span>
        <textarea id="watch" rows="3" placeholder="e.g. Microsoft, Fortinet, Cisco, Chrome, Okta" autocomplete="off" autocapitalize="off" spellcheck="false"></textarea>
        <small class="muted">Vendors, products or topics you care about, separated by commas. Matching stories are highlighted and ranked higher. Saved on this device only.</small>
      </label>
      <label class="check">
        <input id="hide-read" type="checkbox">
        <span>Hide stories I’ve read</span>
      </label>
      <label class="check">
        <input id="compact" type="checkbox">
        <span>Compact list (headlines only, tap to expand)</span>
      </label>
      <div class="field">
        <span>Muted categories</span>
        <div id="mute-cats" class="chips wrap" role="group" aria-label="Muted categories"></div>
      </div>
      <div class="field">
        <span>Muted sources</span>
        <div id="mute-sources" class="chips wrap" role="group" aria-label="Muted sources"></div>
        <small class="muted">Muted stories are hidden everywhere except Saved. A story stays visible if any source covering it isn’t muted.</small>
      </div>
      <p class="field"><a id="update-link" target="_blank" rel="noopener noreferrer" hidden>Update now on GitHub ↗</a><small class="muted">Owner only: starts a new briefing build right away.</small></p>
      <div class="dlg-actions">
        <button id="mark-all" type="button" class="secondary">Mark all as read</button>
        <button value="close" class="primary">Done</button>
      </div>
    </form>
  </dialog>

  <div id="detail" class="detail" role="dialog" aria-modal="true" aria-label="Story" hidden>
    <div class="detail-bar">
      <button class="back" type="button">‹ Back</button>
      <span class="spacer"></span>
      <button class="share icon-btn" type="button" aria-label="Share" hidden>
        <svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true"><path fill="currentColor" d="M12 2l4 4-1.4 1.4L13 5.8V15h-2V5.8L9.4 7.4 8 6l4-4Zm-7 9h3v2H6v7h12v-7h-2v-2h3a1 1 0 0 1 1 1v9a1 1 0 0 1-1 1H5a1 1 0 0 1-1-1v-9a1 1 0 0 1 1-1Z"/></svg>
      </button>
      <button class="save icon-btn" type="button" aria-label="Save" aria-pressed="false">
        <svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true"><path class="outline" fill="currentColor" d="M6 2h12a1 1 0 0 1 1 1v19l-7-4.5L5 22V3a1 1 0 0 1 1-1Zm1 2v14.3l5-3.2 5 3.2V4H7Z"/><path class="filled" fill="currentColor" d="M6 2h12a1 1 0 0 1 1 1v19l-7-4.5L5 22V3a1 1 0 0 1 1-1Z"/></svg>
      </button>
    </div>
    <article class="detail-body"></article>
  </div>

  <template id="card-tpl">
    <article class="card">
      <div class="meta">
        <span class="cat"></span>
        <span class="kev" hidden>CISA KEV</span>
        <span class="new" hidden>New</span>
        <span class="upd" hidden>Update</span>
        <span class="deep" hidden>Deep dive</span>
        <span class="watch" hidden></span>
        <span class="when muted"></span>
      </div>
      <h2 class="title"></h2>
      <p class="upd-note" hidden></p>
      <p class="summary"></p>
      <p class="why" hidden><strong>Why it matters</strong> <span></span></p>
      <div class="cves"></div>
      <div class="actions">
        <a class="read" target="_blank" rel="noopener noreferrer"></a>
        <button class="more" type="button" hidden></button>
        <button class="tl-btn" type="button" hidden></button>
        <span class="spacer"></span>
        <button class="share icon-btn" type="button" aria-label="Share" hidden>
          <svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true"><path fill="currentColor" d="M12 2l4 4-1.4 1.4L13 5.8V15h-2V5.8L9.4 7.4 8 6l4-4Zm-7 9h3v2H6v7h12v-7h-2v-2h3a1 1 0 0 1 1 1v9a1 1 0 0 1-1 1H5a1 1 0 0 1-1-1v-9a1 1 0 0 1 1-1Z"/></svg>
        </button>
        <button class="save icon-btn" type="button" aria-label="Save" aria-pressed="false">
          <svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true"><path class="outline" fill="currentColor" d="M6 2h12a1 1 0 0 1 1 1v19l-7-4.5L5 22V3a1 1 0 0 1 1-1Zm1 2v14.3l5-3.2 5 3.2V4H7Z"/><path class="filled" fill="currentColor" d="M6 2h12a1 1 0 0 1 1 1v19l-7-4.5L5 22V3a1 1 0 0 1 1-1Z"/></svg>
        </button>
      </div>
      <ul class="others" hidden></ul>
      <ol class="timeline" hidden></ol>
    </article>
  </template>
</body>
</html>
